[[mods]]
modId="dragonfinder"
version="1.0.0"
displayName="Dragon Finder"
authors="Floliam"
description='''
Rein clientseitiger Drachenfinder für die Mod Ice and Fire.
Zeigt Art, Entfernung, Höhe und Richtung des nächsten Drachen und findet Drachenhorte (Gold-, Silber-, Kupferhaufen) in geladenen Chunks.
Meldungen erscheinen nur in deinem eigenen Chat. Auf dem Server muss nichts installiert werden.
'''

