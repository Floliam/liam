name: Minecraft-Mod bauen

on:
  push:
    paths:
      - 'minecraft-mod/**'
      - 'dragon-finder-mod/**'
      - '.github/workflows/minecraft-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: minecraft-mod
            artifact: playerlocatorbar-1.18.2-forge
          - dir: dragon-finder-mod
            artifact: dragonfinder-1.18.2-forge
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Mod bauen
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/build/libs/*.jar
          if-no-files-found: error
